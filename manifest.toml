# devbox module manifest
#
# Single source of truth for the catalogue: what can be installed, which version is
# pinned, whether root is required, and what is selected by default.
#
# Bump `pin` to move a tool forward. Everything else reads this file; no version
# number is hard-coded in a module script.

[meta]
schema = 1
updated = "2026-09-15"

# ---------------------------------------------------------------------------
# core - the baseline every box gets
# ---------------------------------------------------------------------------

[[module]]
id = "base"
name = "Build essentials"
category = "core"
summary = "gcc, make, curl, wget, unzip, ca-certificates"
script = "modules/core/base.sh"
default = true
required = true
needs_root = true
pin = "apt"
pin_kind = "apt"
size_mb = 210

[[module]]
id = "git"
name = "Git"
category = "core"
summary = "version control, plus a sane global config"
script = "modules/core/git.sh"
default = true
required = true
needs_root = true
pin = "apt"
pin_kind = "apt"
size_mb = 30

[[module]]
id = "gh"
name = "GitHub CLI"
category = "core"
summary = "gh, from the official cli.github.com apt repository"
script = "modules/core/gh.sh"
default = true
required = false
needs_root = true
pin = "apt"
pin_kind = "apt"
size_mb = 55

[[module]]
id = "cli"
name = "Shell toolkit"
category = "core"
summary = "ripgrep, jq, fzf, tmux, htop, tree"
script = "modules/core/cli.sh"
default = true
required = false
needs_root = true
pin = "apt"
pin_kind = "apt"
size_mb = 40

