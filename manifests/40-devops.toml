# DevOps
#
# Containers, orchestration and infrastructure.

[manifest]
category = "devops"
title = "DevOps"
order = 40

[[module]]
id = "docker"
name = "Docker"
summary = "docker engine, buildx and compose, from Docker's apt repository"
script = "modules/optional/docker.sh"
default = false
required = false
needs_root = true
pin = "apt"
pin_kind = "apt"
size_mb = 480

[[module]]
id = "modal"
name = "Modal CLI"
summary = "client for Modal's serverless compute; requires the Python module"
script = "modules/optional/modal.sh"
requires = ["python"]
default = false
required = false
needs_root = false
pin = "latest"
pin_kind = "latest"
size_mb = 60

[[module]]
id = "aws"
name = "AWS CLI"
summary = "aws v2 from Amazon's own installer, unpacked under $HOME; needs unzip"
script = "modules/optional/aws.sh"
default = false
required = false
needs_root = false
pin = "latest"
pin_kind = "latest"
size_mb = 250

[[module]]
