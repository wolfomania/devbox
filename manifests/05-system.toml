# System
#
# What the machine itself needs before anything is downloaded onto it. These
# come first in the list because they come first in the install.

[manifest]
category = "system"
title = "System"
order = 5

[[module]]
id = "swap"
name = "Swap"
summary = "a swapfile, on a box with under 2 GiB of memory to build in"
script = "modules/system/swap.sh"
default = true
required = false
needs_root = true
pin = ""
channel = "none"
size_mb = 0

[[module]]
id = "firewall"
name = "Firewall"
summary = "ufw: deny inbound except SSH, rate limited"
script = "modules/system/firewall.sh"
default = true
required = false
needs_root = true
pin = ""
channel = "apt"
size_mb = 3

[[module]]
id = "updates"
name = "Security updates"
summary = "unattended-upgrades: security patches daily, no automatic reboot"
script = "modules/system/updates.sh"
default = true
required = false
needs_root = true
pin = ""
channel = "apt"
size_mb = 5
