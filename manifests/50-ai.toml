# AI agents
#
# Terminal agents. Selecting one also carries the bundle in plugin/.

[manifest]
category = "ai"
title = "AI agents"
order = 50

[[module]]
id = "claude-code"
name = "Claude Code"
summary = "Anthropic's terminal agent, from its apt repository"
script = "modules/optional/claude-code.sh"
default = false
required = false
needs_root = false
pin = "stable"
pin_kind = "channel"
size_mb = 220

[[module]]
id = "codex"
name = "Codex CLI"
summary = "OpenAI's terminal agent; requires the Node module"
script = "modules/optional/codex.sh"
requires = ["node"]
default = false
required = false
needs_root = false
pin = "latest"
pin_kind = "latest"
size_mb = 90
